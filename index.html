<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sit Tight</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- ====================================================== -->
    <!-- HEADER -->
    <!-- ====================================================== -->

    <header class="header">

        <h1>Sit Tight</h1>

        <p>OWAS Assessment by MoveNet CNN</p>

    </header>

    <!-- ====================================================== -->
    <!-- MAIN -->
    <!-- ====================================================== -->

    <main class="mainLayout">

        <!-- ================================================== -->
        <!-- LEFT PANEL -->
        <!-- ================================================== -->

        <aside class="leftPanel">

            <!-- Upload -->

            <section class="uploadSection">

                <div class="sectionTitle">

                    <h2>1. Add Photo</h2>

                    <label
                        class="chooseFileButton"
                        for="photoInput">

                        Choose Photo

                    </label>

                    <input
                        id="photoInput"
                        type="file"
                        accept="image/*"
                        hidden>

                </div>

                <!-- Thumbnail -->

                <div class="thumbnailBox">

                    <img
                        id="thumbnail"
                        alt="Thumbnail Preview">

                </div>

            </section>

            <!-- File Information -->

            <section class="fileInformation">

                <p>

                    <strong>File name:</strong>

                    <span id="fileName">

                        -

                    </span>

                </p>

                <p>

                    <strong>Resolution:</strong>

                    <span id="resolution">

                        -

                    </span>

                </p>

                <p>

                    <strong>Size:</strong>

                    <span id="fileSize">

                        -

                    </span>

                </p>

                <p>

                    <strong>Date:</strong>

                    <span id="fileDate">

                        -

                    </span>

                </p>

                <p>

                    <strong>Type:</strong>

                    <span id="fileType">

                        -

                    </span>

                </p>

            </section>

        </aside>

        <!-- ================================================== -->
        <!-- CENTER PANEL -->
        <!-- ================================================== -->

        <section class="centerPanel">

            <div class="sectionTitle">

                <h2>2. Pose Estimate</h2>

                <button
                    type="button">

                    Edit

                </button>

            </div>

            <div class="previewBox">

                <canvas
                    id="poseCanvas"
                    width="1280"
                    height="720">

                </canvas>

                <div class="confidenceBox">

                    Avg. Conf.

                    <span id="avgConfidence">

                        --

                    </span>

                </div>

            </div>

            <div class="measurementGrid">

                <!-- BACK -->

                <section class="measurementCard">

                    <h3>Back</h3>

                    <div class="measurementRow">

                        <span>Flexion</span>

                        <span
                            class="valueBox"
                            id="backFlexion">

                        </span>

                    </div>

                    <div class="measurementRow">

                        <span>Twisted</span>

                        <span
                            class="valueBox"
                            id="backTwisted">

                        </span>

                    </div>

                </section>

                <!-- ARMS -->

                <section class="measurementCard">

                    <h3>Arms (L/R)</h3>

                    <div class="measurementRow">

                        <span>Shoulder</span>

                        <span
                            class="valueBox"
                            id="shoulderAngle">

                        </span>

                    </div>

                    <div class="measurementRow">

                        <span>Elbow</span>

                        <span
                            class="valueBox"
                            id="elbowAngle">

                        </span>

                    </div>

                </section>

                <!-- LEGS -->

                <section class="measurementCard">

                    <h3>Legs (L/R)</h3>

                    <div class="measurementRow">

                        <span>Hip</span>

                        <span
                            class="valueBox"
                            id="hipAngle">

                        </span>

                    </div>

                    <div class="measurementRow">

                        <span>Knee</span>

                        <span
                            class="valueBox"
                            id="kneeAngle">

                        </span>

                    </div>

                </section>

            </div>

        </section>

        <!-- ================================================== -->
        <!-- RIGHT PANEL -->
        <!-- ================================================== -->

        <aside class="rightPanel">

            <!-- LOAD -->

            <section class="loadSection">

                <h2>3. Select Load</h2>

                <label>

                    <input
                        type="radio"
                        name="load"
                        value="1"
                        checked>

                    1 (<10kg)

                </label>

                <label>

                    <input
                        type="radio"
                        name="load"
                        value="2">

                    2 (10-20kg)

                </label>

                <label>

                    <input
                        type="radio"
                        name="load"
                        value="3">

                    3 (>20kg)

                </label>

            </section>

            <!-- RESULT -->

            <section class="resultSection">

                <h2>4. Get Result</h2>

                <p>

                    <strong>OWAS Score:</strong>

                    <span id="owasScore">

                        1231

                    </span>

                </p>

                <p>

                    <strong>Risk Category:</strong>

                    <span id="riskCategory">

                        1

                    </span>

                </p>

            </section>

            <!-- EXPORT -->

            <button
                class="exportButton"
                type="button">

                Export

            </button>

        </aside>

    </main>

    <!-- ====================================================== -->
    <!-- APPLICATION -->
    <!-- ====================================================== -->

    <script
        src="js/app.js">

    </script>

</body>

</html>
